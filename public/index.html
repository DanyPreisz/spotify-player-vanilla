<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify · Vanilla JS</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside>
      <div class="head"><strong>Spot</strong><span id="store" class="pill">…</span></div>
      <input id="q" placeholder="Buscar" />
      <form id="add">
        <input id="title" placeholder="Nueva canción" required />
        <input id="artist" placeholder="Artista" />
        <button type="submit">Agregar</button>
      </form>
      <nav id="list"></nav>
    </aside>
    <footer>
      <div><p id="now">Nada</p><p class="meta" id="meta"></p></div>
      <div class="ctrl">
        <button type="button" id="prev">⏮</button>
        <button type="button" id="play">▶</button>
        <button type="button" id="next">⏭</button>
        <button type="button" id="like">♡</button>
      </div>
      <input id="seek" type="range" min="0" max="100" value="0" />
    </footer>
    <script src="app.js"></script>
  </body>
</html>
